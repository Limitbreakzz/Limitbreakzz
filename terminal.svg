<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610"
     viewBox="0 0 1180 610" role="img"
     aria-labelledby="title description">
<title id="title">Limitbreakzz — Full Stack Developer</title>
<desc id="description">Terminal-style profile card with ASCII portrait, stack, and links.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1117"/>
    <stop offset="1" stop-color="#161B22"/>
  </linearGradient>
  <linearGradient id="ascii-signal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F0F6FC"/>
    <stop offset="1" stop-color="#79C0FF"/>
  </linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"    stop-color="#8B949E"/>
    <stop offset="0.48" stop-color="#58A6FF"/>
    <stop offset="1"    stop-color="#8B949E"/>
  </linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#58A6FF" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#58A6FF" stop-opacity="0.46"/>
    <stop offset="1"   stop-color="#8B949E" stop-opacity="0"/>
  </linearGradient>
  <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#58A6FF" opacity="0.052"/>
  </pattern>
  <clipPath id="portrait-clip">
    <rect x="24" y="82" width="460" height="438" rx="12"/>
  </clipPath>
  <style>
    .mono  { font-family: "Courier New", Consolas, monospace; }
    .ascii { font-family: "Courier New", Consolas, monospace; font-size: 6.5px;
              letter-spacing: -0.15px; fill: url(#ascii-signal); }
    .panel-title  { font-family: "Courier New", Consolas, monospace; font-size: 11px;
                     letter-spacing: 2px; fill: #C9D1D9; opacity: 0.78; }
    .terminal-label { font-family: "Courier New", Consolas, monospace; font-size: 12px;
                       letter-spacing: 0.5px; fill: #8B949E; }
    .live-label { font-family: "Courier New", Consolas, monospace; font-size: 10px;
                   letter-spacing: 1px; fill: #58A6FF; }
    .system-head { font-family: "Courier New", Consolas, monospace;
                    font-size: 16px; font-weight: 700; }
    .system-section, .system-row { font-family: "Courier New", Consolas, monospace;
                                     font-size: 13px; }
    .system-section { font-weight: 700; }
    text, tspan { white-space: pre; }
    @keyframes scan-sweep {
      from { transform: translateY(-80px); }
      to   { transform: translateY(680px); }
    }
    @media (prefers-reduced-motion: no-preference) {
      .motion-scan { animation: scan-sweep 8s linear infinite; }
    }
    @media (prefers-reduced-motion: reduce) {
      .motion-scan { display: none; }
    }
  </style>
</defs>

<!-- ── Background ── -->
<rect width="1180" height="610" rx="18" fill="url(#bg)"/>
<rect width="1180" height="610" rx="18" fill="url(#scanlines)"/>

<!-- ── Title bar ── -->
<rect x="3" y="3" width="1174" height="34" rx="16" fill="#161B22" fill-opacity="0.84"/>
<circle cx="24"  cy="20" r="5" fill="#FF5F57" opacity="0.88"/>
<circle cx="42"  cy="20" r="5" fill="#FEBC2E" opacity="0.88"/>
<circle cx="60"  cy="20" r="5" fill="#28C840" opacity="0.88"/>
<text x="590" y="25" text-anchor="middle" class="terminal-label">Limitbreakzz ~ $ ./profile --live</text>
<circle cx="1038" cy="20" r="4" fill="#58A6FF"/>
<text x="1048" y="24" class="live-label">BUILDING</text>

<!-- ── Left portrait panel ── -->
<rect x="14"  y="48" width="480" height="500" rx="14"
      fill="#161B22" fill-opacity="0.38"
      stroke="url(#border)" stroke-opacity="0.42"/>

<!-- Portrait header label -->
<text x="36" y="72" class="panel-title">VISUAL.MAP / PORTRAIT.SIGNAL</text>

